version: '3.8'

services:
  alpha-agent:
    build: .
    container_name: alpha_consumer_agent
    ports:
      - "8000:8000"
    environment:
      # --- USER CONFIGURATION ---
      # Users put their own wallet key here
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      
      # --- NETWORK CONFIGURATION ---
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CRONOS_RPC_URL=https://evm-t3.cronos.org
      
      # --- CONNECTION TO YOUR SERVER ---
      # If running locally, use 'host.docker.internal' to reach your laptop
      # In production, this would be 'https://api.alpha-consumer.com'
      - TRADING_SIGNALS_URL=http://host.docker.internal:3050
      
    extra_hosts:
      - "host.docker.internal:host-gateway"
