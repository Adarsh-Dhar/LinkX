[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true

evm_version = "paris"

remappings = [
	"forge-std/=lib/forge-std/src/",
	"@openzeppelin/=lib/openzeppelin-contracts/"
]

[rpc_endpoints]
etherlink = "https://node.shadownet.etherlink.com"

[etherscan]
etherlink = { key = "any", url = "https://testnet.explorer.etherlink.com/api" }
